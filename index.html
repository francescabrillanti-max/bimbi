<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palloncino 3D Animato</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; height: 100vh; width: auto; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 1080, H = 1920;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2e6d3);

const fov = 40;
const camDist = (H / 2) / Math.tan(fov / 2 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(fov, W / H, 1, 10000);
camera.position.set(0, 60, camDist);
camera.lookAt(0, 60, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function resize() {
  const h = window.innerHeight;
  const w = h * W / H;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Lights: key from upper-right (matches reference PNG highlight)
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(600, 800, 1200);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffbbaa, 0.4);
fill.position.set(-400, 300, 800);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.25);
rim.position.set(0, -600, -800);
scene.add(rim);

const fly = new THREE.Group();
scene.add(fly);
const spin = new THREE.Group();
fly.add(spin);

const CY = 960 - 592.46, RX = 242.67, RY = 267.56;

// --- Texture fedele al PNG di riferimento ---
const cv = document.createElement('canvas');
cv.width = 256;
cv.height = 256;
const cx = cv.getContext('2d');

// Gradiente verticale: chiaro sopra, scuro sotto (come nel PNG)
for (let y = 0; y < 256; y++) {
  const t = y / 256;
  const shade = Math.round(255 - t * 170); // 255 in alto, 85 in basso
  const r = Math.min(255, Math.round(shade * 0.95));
  const g = Math.round(shade * 0.35);
  const b = Math.round(shade * 0.34);
  for (let x = 0; x < 256; x++) {
    cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    cx.fillRect(x, y, 1, 1);
  }
}

// Highlight (macchia chiara) in alto a destra, come nel PNG
const hx = Math.round(256 * 0.68), hy = Math.round(256 * 0.18);
for (let r = 50; r > 0; r -= 4) {
  const a = Math.round(180 - r * 3);
  if (a < 0) continue;
  cx.fillStyle = 'rgba(255,255,255,' + (a / 255).toFixed(3) + ')';
  cx.beginPath();
  cx.arc(hx, hy, r, 0, Math.PI * 2);
  cx.fill();
}

// Sottile linea verticale (cucitura) per riferimento rotazione
cx.strokeStyle = 'rgba(0,0,0,0.08)';
cx.lineWidth = 2;
cx.beginPath();
cx.moveTo(40, 0);
cx.lineTo(40, 256);
cx.stroke();

// Altra cucitura sul lato opposto
cx.beginPath();
cx.moveTo(210, 0);
cx.lineTo(210, 256);
cx.stroke();

const tex = new THREE.CanvasTexture(cv);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(RX, 48, 48),
  new THREE.MeshPhongMaterial({ map: tex, specular: 0x442222, shininess: 40, emissive: 0x331111, emissiveIntensity: 0.04 })
);
sphere.scale.y = RY / RX;
sphere.position.set(0, CY, 0);
spin.add(sphere);

// Highlight come sfera 3D (si muove con la rotazione)
const hl = new THREE.Mesh(
  new THREE.SphereGeometry(70, 24, 24),
  new THREE.MeshPhongMaterial({ color: 0xffd4d4, transparent: true, opacity: 0.25, emissive: 0xffaaaa, emissiveIntensity: 0.08 })
);
hl.position.set(86.5, -172.5, RX);
sphere.add(hl);

const knot = new THREE.Mesh(
  new THREE.SphereGeometry(10, 16, 16),
  new THREE.MeshPhongMaterial({ color: 0xc43030, shininess: 20 })
);
knot.position.set(0, CY - RY - 5, 0);
spin.add(knot);

const sY1 = 960 - 863.75, sY2 = 960 - 1069.5;
const string = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, sY1, 3),
      new THREE.Vector3(-2, (sY1+sY2)*0.75, 8),
      new THREE.Vector3(-5, (sY1+sY2)*0.5, 12),
      new THREE.Vector3(-7, (sY1+sY2)*0.25, 10),
      new THREE.Vector3(-8, sY2, 5),
    ]), 32, 1.2, 6, false
  ),
  new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.5 })
);
spin.add(string);

fly.position.y = -1500;

let phase = 'fly', phaseStart = performance.now();

function animate(time) {
  requestAnimationFrame(animate);
  if (time === undefined) time = performance.now();
  const t = (time - phaseStart) / 1000;

  if (phase === 'fly') {
    const p = Math.min(t / 3, 1);
    fly.position.y = -1500 * (1 - p) * (1 - p) * (1 - p);
    if (p >= 1) { phase = 'spin'; phaseStart = time; }
  }

  if (phase === 'spin') {
    const p = Math.min(t / 2, 1);
    const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    spin.rotation.y = e * Math.PI * 2;
    if (p >= 1) { phase = 'done'; phaseStart = time; }
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
