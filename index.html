<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palloncino 3D Animato</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; height: 100vh; width: auto; }
</style>
</head>
<body>
<script>
const W = 1080, H = 1920;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2e6d3);

const fov = 40;
const camDist = (H / 2) / Math.tan(fov / 2 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(fov, W / H, 1, 10000);
camera.position.set(0, 60, camDist);
camera.lookAt(0, 60, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function resize() {
  const h = window.innerHeight;
  const w = h * W / H;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(400, 800, 1500);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffcccc, 0.4);
fill.position.set(-500, 200, 1000);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(0, -500, -1000);
scene.add(rim);

const group = new THREE.Group();
scene.add(group);

const rot = new THREE.Group();
group.add(rot);

const CY = 960 - 592.46, RX = 242.67, RY = 267.56;

const tc = document.createElement('canvas');
tc.width = 1024;
tc.height = 1024;
const cx = tc.getContext('2d');
let qa = 0;
function redraw() {
  cx.fillStyle = '#e24b4a';
  cx.fillRect(0, 0, 1024, 1024);
  if (qa > 0.01) {
    const b = [322.59,333.79,349.97,359.93,374.86,386.06,403.48,413.44,427.13,438.33,454.51,464.46,476.91,488.11,505.53,515.49,529.18,540.38,556.55,566.51,578.95,593.89,605.09,622.51,632.47,646.16,657.36,673.54,683.49,695.94,707.14,724.56,734.51,749.45];
    const w = ['4.98','9.96','3.73','8.71','4.98','11.2','3.73','7.47','4.98','9.96','3.73','6.22','4.98','11.2','3.73','7.47','4.98','9.96','3.73','6.22','8.71','4.98','11.2','3.73','7.47','4.98','9.96','3.73','6.22','4.98','11.2','3.73','8.71','4.98'];
    const x0 = 322.59, x1 = 749.45, xr = x1 - x0, y0 = 496.63, y1 = 695.75, yr = y1 - y0;
    const tx0 = 380, tx1 = 644, tw = tx1 - tx0, ty0 = 380, ty1 = 644;
    function qx(x) { return tx0 + (x - x0) / xr * tw; }
    function qy(y) { return ty0 + (y - y0) / yr * tw; }
    function qs(s) { return parseFloat(s) / xr * tw; }
    const a = (qa * 0.9).toFixed(3);
    cx.fillStyle = 'rgba(255,255,255,' + a + ')';
    w.forEach(function(s, i) { cx.fillRect(qx(b[i]), qy(y0), Math.max(1, qs(s)), tw); });
    cx.fillStyle = 'rgba(255,215,0,' + (qa * 0.6).toFixed(3) + ')';
    cx.fillRect(qx(303.92), qy(589.97), qs('485.35'), qs('3.73'));
  }
}
redraw();

const tex = new THREE.CanvasTexture(tc);
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(RX, 48, 48),
  new THREE.MeshPhongMaterial({ map: tex, specular: 0x442222, shininess: 35, emissive: 0x331111, emissiveIntensity: 0.06 })
);
sphere.scale.y = RY / RX;
sphere.position.set(0, CY, 0);
rot.add(sphere);

const hl = new THREE.Mesh(
  new THREE.SphereGeometry(55, 24, 24),
  new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.18, emissive: 0xffffff, emissiveIntensity: 0.1 })
);
hl.position.set(476.91 - 540, 960 - 505.34, RX);
rot.add(hl);

const knot = new THREE.Mesh(
  new THREE.SphereGeometry(10, 16, 16),
  new THREE.MeshPhongMaterial({ color: 0xc43030, shininess: 20 })
);
knot.position.set(0, CY - RY - 5, 0);
group.add(knot);

const sY1 = 960 - 863.75, sY2 = 960 - 1069.5;
const string = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, sY1, 3),
      new THREE.Vector3(-2, (sY1+sY2)*0.75, 8),
      new THREE.Vector3(-5, (sY1+sY2)*0.5, 12),
      new THREE.Vector3(-7, (sY1+sY2)*0.25, 10),
      new THREE.Vector3(-8, sY2, 5),
    ]), 32, 1.2, 6, false
  ),
  new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.5 })
);
group.add(string);

group.position.y = -1500;

let phase = 'fly', phaseStart = performance.now();

function animate(time) {
  requestAnimationFrame(animate);
  if (time === undefined) time = performance.now();
  const t = (time - phaseStart) / 1000;

  if (phase === 'fly') {
    const p = Math.min(t / 3, 1);
    group.position.y = -1500 * (1 - p) * (1 - p) * (1 - p);
    if (p >= 1) { phase = 'spin'; phaseStart = time; }
  }

  if (phase === 'spin') {
    const p = Math.min(t / 2.0, 1);
    const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    rot.rotation.y = e * Math.PI * 2;
    const r = Math.max(0, Math.min(1, (p - 0.3) / 0.7));
    qa = r < 0.5 ? 2 * r * r : -1 + (4 - 2 * r) * r;
    redraw();
    tex.needsUpdate = true;
    if (p >= 1) { phase = 'done'; phaseStart = time; }
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
