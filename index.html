<script>
document.addEventListener('DOMContentLoaded', () => {
  if (typeof anime === 'undefined') { return; }

  const wrapper = document.querySelector('#balloon-wrapper');
  const balloon = document.querySelector('#PALLONCINO');
  const qrcode = document.querySelector('#QRCODE');

  wrapper.setAttribute('transform', 'translate(0, 1500)');

  // 1. Arrivo dal basso
  anime({
    targets: wrapper,
    translateY: { value: [1500, 0], easing: 'easeOutSine', duration: 3000 },
    complete: () => {
      // 2. Rotazione su asse Y
      anime({
        targets: balloon,
        rotateY: { value: [0, 360], easing: 'easeInOutSine', duration: 1500 },
        complete: () => {
          // 3. QR code appare sopra il palloncino
          anime({
            targets: qrcode,
            opacity: { value: [0, 1], easing: 'linear', duration: 600 },
          });
        }
      });
    }
  });
});
</script>
