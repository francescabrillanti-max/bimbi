<script>
document.addEventListener('DOMContentLoaded', () => {
  const wrapper = document.querySelector('#balloon-wrapper');
  if (!wrapper) return;

  const poster = document.querySelector('.poster');
  const ph = poster ? poster.getBoundingClientRect().height : 0;
  const scale = ph > 0 ? ph / 1920 : window.innerHeight / 1920;
  const startY = Math.round((window.innerHeight / scale) + 300);

  anime({
    targets: wrapper,
    translateY: [startY, 0],
    easing: 'easeOutExpo',
    duration: 3200,
    complete: () => {
      const qrOverlay = document.querySelector('#qrcode-overlay');
      const bimboOverlay = document.querySelector('#bimbo-overlay');
      if (qrOverlay) qrOverlay.style.display = 'block';
      if (bimboOverlay) bimboOverlay.style.display = 'block';

      const tl = anime.timeline({
        easing: 'easeInOutQuad'
      });

      tl.add({
        targets: wrapper,
        rotateY: [0, 360],
        duration: 1500
      })
      .add({
        targets: '#qrcode-overlay',
        opacity: [0, 1],
        duration: 500
      }, '-=500')
      .add({
        targets: wrapper,
        rotateY: '+=360',
        duration: 1500
      })
      .add({
        targets: '#qrcode-overlay',
        opacity: [1, 0],
        duration: 500
      }, '-=500')
      .add({
        targets: '#bimbo-overlay',
        opacity: [0, 1],
        duration: 500
      }, '-=500')
      .add({
        targets: wrapper,
        translateY: [0, -10, 0],
        duration: 2000,
        loop: true,
        easing: 'easeInOutSine'
      });
    }
  });
});
</script>
