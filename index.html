<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palloncino 3D Animato</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; height: 100vh; width: auto; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 1080, H = 1920;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2e6d3);

const fov = 40;
const camDist = (H / 2) / Math.tan(fov / 2 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(fov, W / H, 1, 10000);
camera.position.set(0, 60, camDist);
camera.lookAt(0, 60, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function resize() {
  const h = window.innerHeight;
  const w = h * W / H;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(400, 800, 1500);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffcccc, 0.4);
fill.position.set(-500, 200, 1000);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(0, -500, -1000);
scene.add(rim);

const fly = new THREE.Group();
scene.add(fly);
const spin = new THREE.Group();
fly.add(spin);

const CY = 960 - 592.46, RX = 242.67, RY = 267.56;

// Texture con gradiente asimmetrico per rendere visibile la rotazione
const cv = document.createElement('canvas');
cv.width = 256;
cv.height = 256;
const cx = cv.getContext('2d');
for (let x = 0; x < 256; x++) {
  const t = x / 256;
  const red = 0xcc + Math.round(0x16 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 + 0.3)));
  cx.fillStyle = 'rgb(' + red + ',' + Math.round(red * 0.36) + ',' + Math.round(red * 0.345) + ')';
  cx.fillRect(x, 0, 1, 256);
}
const tex = new THREE.CanvasTexture(cv);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(RX, 48, 48),
  new THREE.MeshPhongMaterial({ map: tex, specular: 0x442222, shininess: 35, emissive: 0x331111, emissiveIntensity: 0.06 })
);
sphere.scale.y = RY / RX;
sphere.position.set(0, CY, 0);
spin.add(sphere);

const hl = new THREE.Mesh(
  new THREE.SphereGeometry(80, 24, 24),
  new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, emissive: 0xffffff, emissiveIntensity: 0.2 })
);
hl.position.set(476.91 - 540, 960 - 505.34 - CY, RX);
sphere.add(hl);

const knot = new THREE.Mesh(
  new THREE.SphereGeometry(10, 16, 16),
  new THREE.MeshPhongMaterial({ color: 0xc43030, shininess: 20 })
);
knot.position.set(0, CY - RY - 5, 0);
spin.add(knot);

const sY1 = 960 - 863.75, sY2 = 960 - 1069.5;
const string = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, sY1, 3),
      new THREE.Vector3(-2, (sY1+sY2)*0.75, 8),
      new THREE.Vector3(-5, (sY1+sY2)*0.5, 12),
      new THREE.Vector3(-7, (sY1+sY2)*0.25, 10),
      new THREE.Vector3(-8, sY2, 5),
    ]), 32, 1.2, 6, false
  ),
  new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.5 })
);
spin.add(string);

fly.position.y = -1500;

let phase = 'fly', phaseStart = performance.now();

function animate(time) {
  requestAnimationFrame(animate);
  if (time === undefined) time = performance.now();
  const t = (time - phaseStart) / 1000;

  if (phase === 'fly') {
    const p = Math.min(t / 3, 1);
    fly.position.y = -1500 * (1 - p) * (1 - p) * (1 - p);
    if (p >= 1) { phase = 'spin'; phaseStart = time; }
  }

  if (phase === 'spin') {
    const p = Math.min(t / 2, 1);
    const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    spin.rotation.y = e * Math.PI * 2;
    if (p >= 1) { phase = 'done'; phaseStart = time; }
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
