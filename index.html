<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palloncino 3D Animato</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas { display: block; height: 100vh; width: auto; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 1080, H = 1920;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2e6d3);

const fov = 40;
const camDist = (H / 2) / Math.tan(fov / 2 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(fov, W / H, 1, 10000);
camera.position.set(0, 60, camDist);
camera.lookAt(0, 60, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function resize() {
  const h = window.innerHeight;
  const w = h * W / H;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(600, 800, 1200);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffbbaa, 0.4);
fill.position.set(-400, 300, 800);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.3);
rim.position.set(0, -600, -800);
scene.add(rim);

const fly = new THREE.Group();
scene.add(fly);
const spin = new THREE.Group();
fly.add(spin);

const CY = 960 - 592.46, RX = 242.67, RY = 267.56;

// Texture: solo rosso con cuciture sottili
const cv = document.createElement('canvas');
cv.width = 256;
cv.height = 256;
const cx = cv.getContext('2d');
cx.fillStyle = '#e24b4a';
cx.fillRect(0, 0, 256, 256);
cx.strokeStyle = 'rgba(0,0,0,0.06)';
cx.lineWidth = 2;
cx.beginPath(); cx.moveTo(30, 0); cx.lineTo(30, 256); cx.stroke();
cx.beginPath(); cx.moveTo(220, 0); cx.lineTo(220, 256); cx.stroke();

const tex = new THREE.CanvasTexture(cv);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(RX, 48, 48),
  new THREE.MeshPhongMaterial({ map: tex, specular: 0x442222, shininess: 40, emissive: 0x331111, emissiveIntensity: 0.04 })
);
sphere.scale.y = RY / RX;
sphere.position.set(0, CY, 0);
spin.add(sphere);

// Highlight sulla superficie dell'ellissoide
// Posizione 3D sulla superficie: dal PNG (x=86, y=-172) in proiezione 2D
// Sull'ellissoide: z = sqrt(RX^2 - x^2 - (y*RX/RY)^2)
// hlz = sqrt(242.67^2 - 86^2 - (172*242.67/267.56)^2) = 145.9
// Contro-scala Y: hly = -172 / (RY/RX)
const hl = new THREE.Mesh(
  new THREE.SphereGeometry(45, 24, 24),
  new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, emissive: 0xffffff, emissiveIntensity: 0.1 })
);
const hlx = 86;
const hly = -172 * RX / RY;
const yw = hly * RY / RX;
const hlz = Math.sqrt(RX * RX - hlx * hlx - yw * yw * RX * RX / (RY * RY));
hl.position.set(hlx, hly, hlz);
sphere.add(hl);

const knot = new THREE.Mesh(
  new THREE.SphereGeometry(10, 16, 16),
  new THREE.MeshPhongMaterial({ color: 0xc43030, shininess: 20 })
);
knot.position.set(0, CY - RY - 5, 0);
spin.add(knot);

const sY1 = 960 - 863.75, sY2 = 960 - 1069.5;
const string = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, sY1, 3),
      new THREE.Vector3(-2, (sY1+sY2)*0.75, 8),
      new THREE.Vector3(-5, (sY1+sY2)*0.5, 12),
      new THREE.Vector3(-7, (sY1+sY2)*0.25, 10),
      new THREE.Vector3(-8, sY2, 5),
    ]), 32, 1.2, 6, false
  ),
  new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.5 })
);
spin.add(string);

fly.position.y = -1500;

let phase = 'fly', phaseStart = performance.now();

function animate(time) {
  requestAnimationFrame(animate);
  if (time === undefined) time = performance.now();
  const t = (time - phaseStart) / 1000;

  if (phase === 'fly') {
    const p = Math.min(t / 3, 1);
    fly.position.y = -1500 * (1 - p) * (1 - p) * (1 - p);
    if (p >= 1) { phase = 'spin'; phaseStart = time; }
  }

  if (phase === 'spin') {
    const p = Math.min(t / 2, 1);
    const e = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    spin.rotation.y = e * Math.PI * 2;
    if (p >= 1) { phase = 'done'; phaseStart = time; }
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
